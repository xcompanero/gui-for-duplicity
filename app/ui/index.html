<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GUI For Duplicity</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <aside id="sidebar">
    <h1>GUI For <span>Duplicity</span></h1>
    <nav id="profile-list" aria-label="Backup profiles"></nav>
    <button id="btn-new-profile" class="secondary">＋ New Profile</button>
  </aside>

  <main>
    <!-- Profile editor -->
    <section id="view-profile" class="view">
      <h2 id="profile-heading">Profile</h2>
      <form id="profile-form" autocomplete="off">
        <label>Name
          <input name="name" required placeholder="e.g. home-docs" />
        </label>
        <label>Target URL
          <input name="target" required placeholder="sftp://nas/homes/aidan/Backups/…" />
        </label>
        <label>Source directories (one per line)
          <textarea name="sources" rows="3" placeholder="/home/aidan/Documents"></textarea>
        </label>
        <label>Exclude patterns (one per line)
          <textarea name="excludes" rows="3" placeholder="**/.cache/**"></textarea>
        </label>
        <div class="row">
          <label>Extra duplicity options
            <input name="extra_options" placeholder="--volsize=500 …" />
          </label>
        </div>
        <div class="row">
          <label class="checkline">
            <input type="checkbox" name="encrypt" id="f-encrypt" />
            Encrypt backups with GPG (recommended)
          </label>
          <label class="checkline">
            <input type="checkbox" name="read_only" id="f-readonly" />
            Restore-only profile (frozen archive — no backups)
          </label>
        </div>
        <div class="row">
          <label>Original location root (for "restore to original")
            <input name="original_root" placeholder="e.g. / — paths then map to /home/… (leave empty if unknown)" />
          </label>
          <label>GPG passphrase (for encrypted targets)
            <input name="passphrase" type="password" placeholder="type to save a new one to KWallet" />
          </label>
          <label>&nbsp;
            <div class="pass-actions">
              <button type="button" id="btn-store-pass">Save passphrase to KWallet</button>
              <button type="button" id="btn-forget-pass" class="danger">Forget</button>
            </div>
          </label>
        </div>
        <div class="row">
          <label>Schedule (systemd OnCalendar)
            <input name="schedule" placeholder="empty = manual only · *-*-* 13:00:00 = daily at 13:00 · hourly · *:0/15 — avoid pinning the year" />
          </label>
          <label>Retention (remove-older-than)
            <input name="retention" placeholder="empty = keep forever · e.g. 6M 1Y 30D (case matters: 1h, but 6M)" />
          </label>
        </div>
        <div class="row">
          <label>&nbsp;
            <div class="pass-actions">
              <button type="button" id="btn-set-schedule">Enable schedule</button>
              <button type="button" id="btn-remove-schedule" class="danger">Remove schedule</button>
              <button type="button" id="btn-retention-preview">Preview retention (dry run)</button>
            </div>
          </label>
        </div>
        <p id="schedule-status" class="msg"></p>
        <div class="actions">
          <button type="submit" class="primary">Save profile</button>
          <button type="button" id="btn-delete" class="danger">Delete</button>
          <span class="spacer"></span>
          <button type="button" id="btn-show-status">Show backup status</button>
          <button type="button" id="btn-verify" hidden>Verify against source</button>
          <button type="button" id="btn-backup" class="primary">Back up now</button>
        </div>
        <p id="save-msg" class="msg"></p>
      </form>
    </section>

    <!-- Backup status -->
    <section id="view-status" class="view" hidden>
      <h2>Backup status <span id="status-target" class="subtitle"></span></h2>
      <p id="status-summary"></p>
      <div id="chains"></div>
    </section>

    <!-- Snapshot file browser -->
    <section id="view-files" class="view" hidden>
      <h2>
        <button id="btn-files-back" class="linklike">← Status</button>
        Snapshot files
        <span id="files-meta" class="subtitle"></span>
      </h2>
      <div class="file-toolbar">
        <input id="file-filter" placeholder="Filter paths… (e.g. Documents/photos)" />
        <span id="file-count" class="subtitle"></span>
      </div>
      <div id="stale-banner" class="banner" hidden>
        <span>A newer backup exists on this target — the index below is from the previous one.</span>
        <button id="btn-refresh-index">Refresh index</button>
        <button id="btn-dismiss-stale" title="Ignore until next time">✕</button>
      </div>
      <div id="restore-bar" class="restore-bar" hidden>
        <div class="restore-line">
          <span class="rlabel">Restore</span>
          <code id="restore-path"></code>
          <span class="rlabel">to</span>
          <input id="restore-dest" placeholder="destination directory" />
          <button id="btn-choose-dest">Choose…</button>
        </div>
        <div class="restore-line">
          <button id="btn-do-restore" class="primary">Restore</button>
          <button id="btn-orig-dest" hidden>To original location</button>
          <button id="btn-cancel-restore">Cancel</button>
          <span id="restore-note" class="subtitle"></span>
        </div>
      </div>
      <div id="file-list"></div>
    </section>

    <!-- Backup log -->
    <section id="view-log" class="view" hidden>
      <h2>Backup log <span id="log-job" class="subtitle"></span></h2>
      <pre id="log" aria-live="polite"></pre>
      <p id="log-status" class="msg"></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
